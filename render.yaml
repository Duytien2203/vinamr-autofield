services:
  - type: web
    name: vinamr-autofield
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DB_PATH
        value: /var/data/quota_system.db
    disk:
      name: vinamr-data
      mountPath: /var/data
      sizeGB: 1
